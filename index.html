<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Driver Detector</title>
  </head>
  <body
    id="body"
    style="
      font-family: sans-serif;
      text-align: center;
      padding: 12px;
      margin: 0;
      background: #f8f9fa;
    "
  >
    <h3 style="margin: 6px 0 10px">Sleeping Driver Detector</h3>
    <button
      onclick="start()"
      style="
        width: 92%;
        max-width: 320px;
        padding: 14px;
        font-size: 17px;
        font-weight: bold;
        background: #1a73e8;
        color: #fff;
        border: 0;
        border-radius: 10px;
        margin-bottom: 8px;
      "
    >
      1. Start Camera
    </button>
    <button
      onclick="connectUSB()"
      style="
        width: 92%;
        max-width: 320px;
        padding: 10px;
        font-size: 14px;
        background: #e8eaed;
        color: #333;
        border: 0;
        border-radius: 8px;
        margin-bottom: 10px;
      "
    >
      2. Connect Arduino
    </button>
    <div
      id="status"
      style="
        width: 92%;
        max-width: 320px;
        margin: 0 auto 10px;
        padding: 10px;
        border-radius: 8px;
        background: #e6f4ea;
        color: #137333;
        font-size: 19px;
        font-weight: bold;
      "
    >
      Ready! Tap Start
    </div>
    <video
      id="vid"
      autoplay
      playsinline
      muted
      style="
        width: 240px;
        height: 240px;
        object-fit: cover;
        border-radius: 14px;
        transform: scaleX(-1);
        background: #000;
      "
    ></video>
    <div
      id="info"
      style="margin-top: 8px; font-size: 14px; font-weight: bold; color: #444"
    >
      Waiting...
    </div>
    <canvas id="c" width="320" height="240" style="display: none"></canvas>

    <script>
      var writer,
        closedStart = 0,
        base = 0,
        learn = 0,
        miss = 0,
        lx = -1,
        ly = -1,
        lw = -1,
        fd = null,
        audio,
        sirenTick = 0;
      var vid = document.getElementById("vid"),
        c = document.getElementById("c"),
        ctx = c.getContext("2d", { willReadFrequently: true }),
        st = document.getElementById("status");

      try {
        if (window.FaceDetector)
          fd = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
      } catch (e) {}

      function connectUSB() {
        if (!navigator.serial) return alert("Using mobile speaker alarm.");
        navigator.serial
          .requestPort()
          .then((p) =>
            p.open({ baudRate: 9600 }).then(() => {
              writer = p.writable.getWriter();
              alert("Arduino Connected!");
            }),
          )
          .catch(() => alert("Using mobile speaker alarm."));
      }

      function sendUSB(v) {
        if (writer)
          try {
            writer.write(new TextEncoder().encode(v));
          } catch (e) {}
      }

      function playLoudSiren() {
        if (!audio) return;
        try {
          var osc = audio.createOscillator(),
            gain = audio.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(
            sirenTick % 2 === 0 ? 1100 : 800,
            audio.currentTime,
          );
          sirenTick++;
          gain.gain.setValueAtTime(1.0, audio.currentTime);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start();
          osc.stop(audio.currentTime + 0.14);
        } catch (e) {}
      }

      function eyeGap(cx, cy, fw, fh) {
        var rx = Math.max(6, Math.round(fw * 0.08)),
          ry = Math.max(5, Math.round(fh * 0.06));
        var x0 = Math.max(1, Math.round(cx - rx)),
          y0 = Math.max(1, Math.round(cy - ry));
        var w = Math.min(318 - x0, rx * 2),
          h = Math.min(238 - y0, ry * 2);
        if (w <= 3 || h <= 3) return -1;
        var d = ctx.getImageData(x0, y0, w, h).data,
          edge = 0,
          valid = 0,
          skin = 0;
        for (var i = 0; i < d.length; i += 4) {
          var r = d.at(i),
            g = d.at(i + 1),
            b = d.at(i + 2),
            lum = r * 0.299 + g * 0.587 + b * 0.114;
          if (lum > 42 && ((r > g && g >= b) || lum > 145)) skin++;
        }
        if (skin < w * h * 0.35) return -1;
        for (var y = 0; y < h - 1; y++) {
          for (var x = 0; x < w; x++) {
            var i1 = (y * w + x) * 4,
              i2 = ((y + 1) * w + x) * 4;
            var l1 =
              d.at(i1) * 0.299 + d.at(i1 + 1) * 0.587 + d.at(i1 + 2) * 0.114;
            var l2 =
              d.at(i2) * 0.299 + d.at(i2 + 1) * 0.587 + d.at(i2 + 2) * 0.114;
            if (l1 > 32 && l2 > 32) {
              edge += Math.abs(l1 - l2);
              valid++;
            }
          }
        }
        return valid > 0 ? (edge / valid) * (h / 12) : -1;
      }

      function start() {
        st.innerText = "Opening Camera...";
        try {
          if (!audio)
            audio = new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === "suspended") audio.resume();
        } catch (e) {}
        navigator.mediaDevices
          .getUserMedia({
            video: { facingMode: "user", width: 320, height: 240 },
            audio: false,
          })
          .then((s) => {
            vid.srcObject = s;
            return vid.play();
          })
          .then(() => {
            learn = 0;
            base = 0;
            closedStart = 0;
            loop();
          })
          .catch((e) => {
            st.innerText = "Error: " + e.message;
          });
      }

      function evaluate(pts, fw, fh) {
        var s1 = eyeGap(pts.at(0).x, pts.at(0).y, fw, fh),
          s2 = eyeGap(pts.at(1).x, pts.at(1).y, fw, fh);
        var sc = s1 > 0 && s2 > 0 ? (s1 + s2) / 2 : s1 > 0 ? s1 : s2;
        var dist = fw > 175 ? "Near" : fw < 85 ? "Far" : "Optimal";
        if (sc < 0) {
          closedStart = 0;
          document.getElementById("info").innerText = dist + " | Dark Ignored";
          return requestAnimationFrame(loop);
        }
        if (learn < 10) {
          base = (base * learn + sc) / (learn + 1);
          learn++;
          st.innerText = "Locking Eyes...";
          st.style.background = "#e8f0fe";
          st.style.color = "#1a73e8";
        } else {
          if (sc > base * 0.86) base = base * 0.94 + sc * 0.06;
          var openPct = Math.round((sc / Math.max(0.1, base)) * 100);
          if (openPct < 65) {
            if (closedStart === 0) closedStart = Date.now();
            var elapsed = (Date.now() - closedStart) / 1000;
            document.getElementById("info").innerText =
              dist + " | Closed: " + elapsed.toFixed(1) + "s / 3.0s";
            if (elapsed >= 3.0) {
              st.innerText = "WAKE UP!";
              st.style.background = "#d93025";
              st.style.color = "#fff";
              document.getElementById("body").style.background = "#fce8e6";
              playLoudSiren();
              sendUSB("1");
            }
          } else {
            closedStart = 0;
            document.getElementById("info").innerText =
              dist + " | Openness: " + openPct + "%";
            st.innerText = "Awake";
            st.style.background = "#e6f4ea";
            st.style.color = "#137333";
            document.getElementById("body").style.background = "#f8f9fa";
            sendUSB("0");
          }
        }
        requestAnimationFrame(loop);
      }

      function loop() {
        if (vid.readyState < 2) return requestAnimationFrame(loop);
        ctx.drawImage(vid, 0, 0, 320, 240);
        if (fd) {
          fd.detect(c)
            .then((faces) => {
              if (faces && faces.length > 0) {
                miss = 0;
                var f = faces.at(0),
                  b = f.boundingBox,
                  cx = b.left + b.width / 2,
                  cy = b.top + b.height / 2;
                if (lx !== -1 && Math.hypot(cx - lx, cy - ly) > 85) {
                  learn = 0;
                  base = 0;
                  closedStart = 0;
                }
                if (lw !== -1 && Math.abs(b.width - lw) > 15 && learn >= 10)
                  learn = 5;
                lx = cx;
                ly = cy;
                lw = b.width;
                var eyes = (f.landmarks || []).filter((l) => l.type === "eye");
                var pts =
                  eyes.length >= 2
                    ? [eyes.at(0).locations.at(0), eyes.at(1).locations.at(0)]
                    : [
                        {
                          x: b.left + b.width * 0.34,
                          y: b.top + b.height * 0.37,
                        },
                        {
                          x: b.left + b.width * 0.66,
                          y: b.top + b.height * 0.37,
                        },
                      ];
                evaluate(pts, b.width, b.height);
              } else {
                if (++miss > 10) {
                  learn = 0;
                  base = 0;
                  closedStart = 0;
                  lx = -1;
                  ly = -1;
                  lw = -1;
                }
                st.innerText = "Waiting for Driver...";
                st.style.background = "#fef7e0";
                st.style.color = "#b06000";
                document.getElementById("info").innerText =
                  "Scanning All Angles...";
                document.getElementById("body").style.background = "#f8f9fa";
                sendUSB("0");
                requestAnimationFrame(loop);
              }
            })
            .catch(() => {
              fd = null;
              requestAnimationFrame(loop);
            });
        } else {
          evaluate(
            [
              { x: 120, y: 95 },
              { x: 200, y: 95 },
            ],
            140,
            140,
          );
        }
      }
    </script>
  </body>
</html>
