<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Sleeping Driver Detector</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body
    id="body"
    style="
      font-family: sans-serif;
      text-align: center;
      padding: 12px;
      margin: 0;
      background: #f8f9fa;
    "
  >
    <h3 style="margin: 6px 0 10px">Sleeping Driver Detector</h3>
    <button
      id="btn"
      onclick="start()"
      style="
        width: 92%;
        max-width: 320px;
        padding: 14px;
        font-size: 17px;
        font-weight: bold;
        background: #1a73e8;
        color: #fff;
        border: 0;
        border-radius: 10px;
        margin-bottom: 8px;
      "
    >
      1. Start Camera
    </button>
    <button
      onclick="connectUSB()"
      style="
        width: 92%;
        max-width: 320px;
        padding: 10px;
        font-size: 14px;
        background: #e8eaed;
        color: #333;
        border: 0;
        border-radius: 8px;
        margin-bottom: 10px;
      "
    >
      2. Connect Arduino
    </button>
    <div
      id="status"
      style="
        width: 92%;
        max-width: 320px;
        margin: 0 auto 10px;
        padding: 10px;
        border-radius: 8px;
        background: #e6f4ea;
        color: #137333;
        font-size: 19px;
        font-weight: bold;
      "
    >
      Ready! Tap Start
    </div>
    <video
      id="vid"
      autoplay
      playsinline
      muted
      style="
        width: 240px;
        height: 240px;
        object-fit: cover;
        border-radius: 14px;
        transform: scaleX(-1);
        background: #000;
      "
    ></video>
    <div
      id="info"
      style="margin-top: 8px; font-size: 14px; font-weight: bold; color: #444"
    >
      Waiting...
    </div>

    <script>
      var detector = null,
        writer = null,
        closedStart = 0,
        audio = null,
        sirenTick = 0;
      var vid = document.getElementById("vid"),
        st = document.getElementById("status"),
        info = document.getElementById("info");

      function connectUSB() {
        if (!navigator.serial) return alert("Using mobile speaker alarm.");
        navigator.serial
          .requestPort()
          .then(function (p) {
            return p.open({ baudRate: 9600 }).then(function () {
              writer = p.writable.getWriter();
              alert("Arduino Connected!");
            });
          })
          .catch(function () {
            alert("Using mobile speaker alarm.");
          });
      }

      function sendUSB(v) {
        if (writer)
          try {
            writer.write(new TextEncoder().encode(v));
          } catch (e) {}
      }

      function playLoudSiren() {
        if (!audio) return;
        try {
          var osc = audio.createOscillator(),
            gain = audio.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(
            sirenTick % 2 === 0 ? 1100 : 800,
            audio.currentTime,
          );
          sirenTick++;
          gain.gain.setValueAtTime(1.0, audio.currentTime);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start();
          osc.stop(audio.currentTime + 0.14);
        } catch (e) {}
      }

      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      async function start() {
        try {
          st.innerText = "Opening Camera...";
          if (!audio)
            audio = new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === "suspended") await audio.resume();

          var stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: 320, height: 240 },
            audio: false,
          });
          vid.srcObject = stream;
          await vid.play();

          if (!detector) {
            st.innerText = "Loading Eye AI (3s)...";
            await tf.setBackend("webgl");
            detector = await faceLandmarksDetection.createDetector(
              faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh,
              { runtime: "tfjs", refineLandmarks: false, maxFaces: 1 },
            );
          }

          st.innerText = "Awake";
          loop();
        } catch (err) {
          st.innerText = "Error: " + err.message;
          st.style.background = "#fce8e6";
          st.style.color = "#d93025";
        }
      }

      async function loop() {
        if (vid.readyState >= 2 && detector) {
          try {
            var faces = await detector.estimateFaces(vid, {
              flipHorizontal: false,
            });
            if (faces && faces.length > 0) {
              var kp = faces.at(0).keypoints;

              // Exact 3D eyelid landmarks (Left: 159, 145, 33, 133 | Right: 386, 374, 362, 263)
              var leftEAR =
                dist(kp.at(159), kp.at(145)) /
                Math.max(1, dist(kp.at(33), kp.at(133)));
              var rightEAR =
                dist(kp.at(386), kp.at(374)) /
                Math.max(1, dist(kp.at(362), kp.at(263)));
              var ear = (leftEAR + rightEAR) / 2;

              // Trigger 3-second timer when Eye Aspect Ratio drops below 0.21
              if (ear < 0.21) {
                if (closedStart === 0) closedStart = Date.now();
                var elapsed = (Date.now() - closedStart) / 1000;
                info.innerText =
                  "EAR: " +
                  ear.toFixed(2) +
                  " | Closed: " +
                  elapsed.toFixed(1) +
                  "s / 3.0s";

                if (elapsed >= 3.0) {
                  st.innerText = "WAKE UP!";
                  st.style.background = "#d93025";
                  st.style.color = "#fff";
                  document.getElementById("body").style.background = "#fce8e6";
                  playLoudSiren();
                  sendUSB("1");
                }
              } else {
                closedStart = 0;
                info.innerText = "Eyes Locked | EAR: " + ear.toFixed(2);
                st.innerText = "Awake";
                st.style.background = "#e6f4ea";
                st.style.color = "#137333";
                document.getElementById("body").style.background = "#f8f9fa";
                sendUSB("0");
              }
            } else {
              closedStart = 0;
              st.innerText = "Waiting for Driver...";
              st.style.background = "#fef7e0";
              st.style.color = "#b06000";
              info.innerText = "Show face to camera";
              document.getElementById("body").style.background = "#f8f9fa";
              sendUSB("0");
            }
          } catch (e) {}
        }
        requestAnimationFrame(loop);
      }
    </script>
  </body>
</html>
