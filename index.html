<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleeping Driver Detector</title>
  </head>
  <body
    id="pageBody"
    style="
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background-color: #f8f9fa;
      transition: 0.2s;
    "
  >
    <h2 style="margin: 8px 0 14px 0; color: #202124">
      Sleeping Driver Detector
    </h2>

    <button
      id="startBtn"
      onclick="startCamera()"
      disabled
      style="
        width: 95%;
        max-width: 340px;
        padding: 16px;
        font-size: 18px;
        font-weight: bold;
        background: #9aa0a6;
        color: white;
        border: none;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
      "
    >
      Loading Google AI...
    </button>

    <button
      onclick="connectArduino()"
      style="
        width: 95%;
        max-width: 340px;
        padding: 12px;
        font-size: 15px;
        background: #e8eaed;
        color: #333;
        border: none;
        border-radius: 10px;
        margin-bottom: 14px;
        cursor: pointer;
      "
    >
      2. Connect Arduino (Optional)
    </button>

    <div
      id="status"
      style="
        width: 95%;
        max-width: 340px;
        margin: 0 auto 14px auto;
        padding: 12px;
        border-radius: 10px;
        background: #e6f4ea;
        color: #137333;
        font-size: 20px;
        font-weight: bold;
      "
    >
      Preparing AI...
    </div>

    <video
      id="webcam"
      autoplay
      playsinline
      muted
      style="
        width: 260px;
        height: 260px;
        object-fit: cover;
        border-radius: 16px;
        transform: scaleX(-1);
        background: #000;
      "
    ></video>
    <div
      id="debug"
      style="margin-top: 10px; font-size: 16px; font-weight: bold; color: #555"
    >
      Eye Closure: 0%
    </div>

    <script type="module">
      import { FaceLandmarker, FilesetResolver } from "https://jsdelivr.net";

      let faceLandmarker,
        writer,
        closedFrames = 0;
      let audio = new (window.AudioContext || window.webkitAudioContext)();
      const video = document.getElementById("webcam");
      const statusBox = document.getElementById("status");
      const startBtn = document.getElementById("startBtn");

      async function loadAI() {
        try {
          const vision = await FilesetResolver.forVisionTasks(
            "https://jsdelivr.net",
          );
          faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: "https://googleapis.com",
            },
            outputFaceBlendshapes: true,
            runningMode: "VIDEO",
            numFaces: 1,
          });

          startBtn.disabled = false;
          startBtn.style.background = "#1a73e8";
          startBtn.innerText = "1. Start Front Camera";
          statusBox.innerText = "Ready! Tap Start";
        } catch (err) {
          statusBox.innerText = "AI Load Error: " + err.message;
          statusBox.style.background = "#fce8e6";
          statusBox.style.color = "#d93025";
        }
      }
      loadAI();

      window.connectArduino = async function () {
        try {
          const port = await navigator.serial.requestPort();
          await port.open({ baudRate: 9600 });
          writer = port.writable.getWriter();
          alert("Arduino Nano Connected!");
        } catch (e) {
          alert("No Arduino connected. Using mobile speaker alarm.");
        }
      };

      window.startCamera = async function () {
        try {
          if (audio.state === "suspended") await audio.resume();
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: 320, height: 240 },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();
          statusBox.innerText = "Awake";
          predictLoop();
        } catch (err) {
          statusBox.innerText = "Camera Error: " + err.message;
        }
      };

      let lastVideoTime = -1;
      async function predictLoop() {
        if (video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const results = faceLandmarker.detectForVideo(
            video,
            performance.now(),
          );

          if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
            const shapes = results.faceBlendshapes.at(0).categories;
            const leftBlink = shapes.find(
              (s) => s.categoryName === "eyeBlinkLeft",
            ).score;
            const rightBlink = shapes.find(
              (s) => s.categoryName === "eyeBlinkRight",
            ).score;
            const avgClosed = (leftBlink + rightBlink) / 2;

            document.getElementById("debug").innerText =
              "Eye Closure: " + Math.round(avgClosed * 100) + "%";

            if (avgClosed > 0.55) {
              closedFrames++;
              if (closedFrames > 22) {
                statusBox.innerText = "WAKE UP!";
                statusBox.style.background = "#d93025";
                statusBox.style.color = "white";
                document.getElementById("pageBody").style.backgroundColor =
                  "#fce8e6";

                let osc = audio.createOscillator();
                osc.type = "square";
                osc.frequency.setValueAtTime(950, audio.currentTime);
                osc.connect(audio.destination);
                osc.start();
                osc.stop(audio.currentTime + 0.12);

                if (writer) writer.write(new TextEncoder().encode("1"));
              }
            } else {
              closedFrames = 0;
              statusBox.innerText = "Awake";
              statusBox.style.background = "#e6f4ea";
              statusBox.style.color = "#137333";
              document.getElementById("pageBody").style.backgroundColor =
                "#f8f9fa";
              if (writer) writer.write(new TextEncoder().encode("0"));
            }
          }
        }
        requestAnimationFrame(predictLoop);
      }
    </script>
  </body>
</html>
