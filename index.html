<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleeping Driver Detector</title>
  </head>
  <body
    id="pageBody"
    style="
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background-color: #f8f9fa;
      transition: 0.2s;
    "
  >
    <h2 style="margin: 8px 0 14px 0; color: #202124">
      Sleeping Driver Detector
    </h2>

    <button
      id="startBtn"
      onclick="startCamera()"
      style="
        width: 95%;
        max-width: 340px;
        padding: 16px;
        font-size: 18px;
        font-weight: bold;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
      "
    >
      1. Start Front Camera
    </button>

    <button
      onclick="connectArduino()"
      style="
        width: 95%;
        max-width: 340px;
        padding: 12px;
        font-size: 15px;
        background: #e8eaed;
        color: #333;
        border: none;
        border-radius: 10px;
        margin-bottom: 14px;
        cursor: pointer;
      "
    >
      2. Connect Arduino (Optional)
    </button>

    <div
      id="status"
      style="
        width: 95%;
        max-width: 340px;
        margin: 0 auto 14px auto;
        padding: 12px;
        border-radius: 10px;
        background: #e6f4ea;
        color: #137333;
        font-size: 20px;
        font-weight: bold;
      "
    >
      Ready! Instant Start
    </div>

    <div
      style="position: relative; width: 260px; height: 260px; margin: 0 auto"
    >
      <video
        id="webcam"
        autoplay
        playsinline
        muted
        style="
          width: 260px;
          height: 260px;
          object-fit: cover;
          border-radius: 16px;
          transform: scaleX(-1);
          background: #000;
        "
      ></video>
      <!-- Eye alignment guide box -->
      <div
        style="
          position: absolute;
          top: 85px;
          left: 55px;
          width: 150px;
          height: 45px;
          border: 3px solid #00e676;
          border-radius: 10px;
          pointer-events: none;
        "
      ></div>
    </div>

    <p style="font-size: 14px; color: #555; margin: 8px 0">
      Align your eyes inside the green box
    </p>
    <button
      onclick="calibrateOpenEyes()"
      style="
        padding: 10px 20px;
        font-size: 15px;
        background: #34a853;
        color: white;
        border: none;
        border-radius: 8px;
        margin-bottom: 8px;
      "
    >
      Set Open Eyes (Calibrate)
    </button>
    <div id="debug" style="font-size: 15px; font-weight: bold; color: #555">
      Eye Contrast: --
    </div>

    <canvas id="canvas" width="150" height="45" style="display: none"></canvas>

    <script>
      let writer,
        closedFrames = 0,
        openEyeBaseline = 0;
      let audio = new (window.AudioContext || window.webkitAudioContext)();
      const video = document.getElementById("webcam");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const statusBox = document.getElementById("status");

      async function connectArduino() {
        try {
          const port = await navigator.serial.requestPort();
          await port.open({ baudRate: 9600 });
          writer = port.writable.getWriter();
          alert("Arduino Nano Connected!");
        } catch (e) {
          alert("No Arduino connected. Using mobile speaker alarm.");
        }
      }

      function measureEyeContrast() {
        ctx.drawImage(video, 65, 95, 190, 60, 0, 0, 150, 45);
        const data = ctx.getImageData(0, 0, 150, 45).data;
        let darkPixels = 0;
        let totalBrightness = 0;

        for (let i = 0; i < data.length; i += 4) {
          const brightness = (data.at(i) + data.at(i + 1) + data.at(i + 2)) / 3;
          totalBrightness += brightness;
        }
        const avgBrightness = totalBrightness / (data.length / 4);

        for (let i = 0; i < data.length; i += 4) {
          const brightness = (data.at(i) + data.at(i + 1) + data.at(i + 2)) / 3;
          if (brightness < avgBrightness * 0.65) {
            darkPixels++;
          }
        }
        return darkPixels;
      }

      function calibrateOpenEyes() {
        openEyeBaseline = measureEyeContrast();
        alert("Open eyes saved! Now close your eyes to test.");
      }

      async function startCamera() {
        try {
          if (audio.state === "suspended") await audio.resume();
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: 320, height: 240 },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();

          setTimeout(() => {
            openEyeBaseline = measureEyeContrast();
            statusBox.innerText = "Awake";
            detectLoop();
          }, 600);
        } catch (err) {
          statusBox.innerText = "Camera Error: " + err.message;
        }
      }

      async function detectLoop() {
        const currentContrast = measureEyeContrast();
        document.getElementById("debug").innerText =
          "Pupil Score: " +
          currentContrast +
          " (Open: " +
          openEyeBaseline +
          ")";

        // When eyes close, dark pupils disappear so contrast drops below 55% of open baseline
        if (openEyeBaseline > 0 && currentContrast < openEyeBaseline * 0.55) {
          closedFrames++;
          if (closedFrames > 35) {
            statusBox.innerText = "WAKE UP!";
            statusBox.style.background = "#d93025";
            statusBox.style.color = "white";
            document.getElementById("pageBody").style.backgroundColor =
              "#fce8e6";

            let osc = audio.createOscillator();
            osc.type = "square";
            osc.frequency.setValueAtTime(950, audio.currentTime);
            osc.connect(audio.destination);
            osc.start();
            osc.stop(audio.currentTime + 0.12);

            if (writer) writer.write(new TextEncoder().encode("1"));
          }
        } else {
          closedFrames = 0;
          statusBox.innerText = "Awake";
          statusBox.style.background = "#e6f4ea";
          statusBox.style.color = "#137333";
          document.getElementById("pageBody").style.backgroundColor = "#f8f9fa";
          if (writer) writer.write(new TextEncoder().encode("0"));
        }
        requestAnimationFrame(detectLoop);
      }
    </script>
  </body>
</html>
