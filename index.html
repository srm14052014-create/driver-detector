<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleeping Driver Detector</title>
  </head>
  <body
    id="pageBody"
    style="
      font-family: sans-serif;
      text-align: center;
      padding: 16px;
      margin: 0;
      background-color: #f8f9fa;
      transition: 0.2s;
    "
  >
    <h2 style="margin: 8px 0 14px 0; color: #202124">
      Sleeping Driver Detector
    </h2>

    <button
      id="startBtn"
      onclick="startCamera()"
      style="
        width: 95%;
        max-width: 340px;
        padding: 16px;
        font-size: 18px;
        font-weight: bold;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
      "
    >
      1. Start Auto Detection
    </button>

    <button
      onclick="connectArduino()"
      style="
        width: 95%;
        max-width: 340px;
        padding: 11px;
        font-size: 14px;
        background: #e8eaed;
        color: #333;
        border: none;
        border-radius: 10px;
        margin-bottom: 12px;
        cursor: pointer;
      "
    >
      2. Connect Arduino (Optional)
    </button>

    <div
      id="status"
      style="
        width: 95%;
        max-width: 340px;
        margin: 0 auto 12px auto;
        padding: 12px;
        border-radius: 10px;
        background: #e6f4ea;
        color: #137333;
        font-size: 20px;
        font-weight: bold;
      "
    >
      Ready! Tap Start
    </div>

    <div style="width: 260px; height: 260px; margin: 0 auto">
      <video
        id="webcam"
        autoplay
        playsinline
        muted
        style="
          width: 260px;
          height: 260px;
          object-fit: cover;
          border-radius: 16px;
          transform: scaleX(-1);
          background: #000;
        "
      ></video>
    </div>

    <div
      id="debug"
      style="margin-top: 10px; font-size: 15px; font-weight: bold; color: #444"
    >
      Eye Lock: Ready
    </div>
    <canvas id="proc" width="320" height="240" style="display: none"></canvas>

    <script>
      var writer = null;
      var closedFrames = 0;
      var openBaseline = 0;
      var learnCount = 0;
      var missingFrames = 0;
      var lastFaceX = -1;
      var lastFaceY = -1;
      var faceDetector = null;
      var audio = null;

      var video = document.getElementById("webcam");
      var proc = document.getElementById("proc");
      var pctx = proc.getContext("2d", { willReadFrequently: true });
      var statusBox = document.getElementById("status");

      try {
        if (window.FaceDetector) {
          faceDetector = new window.FaceDetector({
            fastMode: true,
            maxDetectedFaces: 1,
          });
        }
      } catch (e) {
        faceDetector = null;
      }

      function connectArduino() {
        if (!navigator.serial) {
          alert("USB Serial not supported here. Using mobile speaker alarm.");
          return;
        }
        navigator.serial
          .requestPort()
          .then(function (port) {
            return port.open({ baudRate: 9600 }).then(function () {
              writer = port.writable.getWriter();
              alert("Arduino Nano Connected!");
            });
          })
          .catch(function () {
            alert("No Arduino connected. Using mobile speaker alarm.");
          });
      }

      function measureEyelidGap(cx, cy, faceWidth) {
        var rx = Math.max(5, Math.round(faceWidth * 0.065));
        var ry = Math.max(4, Math.round(faceWidth * 0.05));
        var x0 = Math.max(1, Math.round(cx - rx));
        var y0 = Math.max(1, Math.round(cy - ry));
        var w = Math.min(318 - x0, rx * 2);
        var h = Math.min(238 - y0, ry * 2);
        if (w <= 2 || h <= 2) return -1;

        var data = pctx.getImageData(x0, y0, w, h).data;
        var verticalEdge = 0;
        var validPixels = 0;
        var skinOrEyePixels = 0;
        var totalPixels = w * h;

        for (var i = 0; i < data.length; i += 4) {
          var r = data[i];
          var g = data[i + 1];
          var b = data[i + 2];
          var lum = r * 0.299 + g * 0.587 + b * 0.114;
          if (lum > 45 && ((r > g && g >= b) || lum > 150)) {
            skinOrEyePixels++;
          }
        }

        if (skinOrEyePixels < totalPixels * 0.35) {
          return -1;
        }

        for (var y = 0; y < h - 1; y++) {
          for (var x = 0; x < w; x++) {
            var iTop = (y * w + x) * 4;
            var iBot = ((y + 1) * w + x) * 4;
            var lumTop =
              data[iTop] * 0.299 +
              data[iTop + 1] * 0.587 +
              data[iTop + 2] * 0.114;
            var lumBot =
              data[iBot] * 0.299 +
              data[iBot + 1] * 0.587 +
              data[iBot + 2] * 0.114;

            if (lumTop > 35 && lumBot > 35) {
              verticalEdge += Math.abs(lumTop - lumBot);
              validPixels++;
            }
          }
        }
        return validPixels > 0 ? verticalEdge / validPixels : -1;
      }

      function resetForNewPerson() {
        learnCount = 0;
        openBaseline = 0;
        closedFrames = 0;
      }

      function startCamera() {
        statusBox.innerText = "Opening Camera...";
        try {
          if (!audio) {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            audio = new AudioCtx();
          }
          if (audio.state === "suspended") {
            audio.resume();
          }
        } catch (e) {}

        navigator.mediaDevices
          .getUserMedia({
            video: { facingMode: "user", width: 320, height: 240 },
            audio: false,
          })
          .then(function (stream) {
            video.srcObject = stream;
            return video.play();
          })
          .then(function () {
            resetForNewPerson();
            detectLoop();
          })
          .catch(function (err) {
            statusBox.innerText = "Camera Error: " + err.message;
            statusBox.style.background = "#fce8e6";
            statusBox.style.color = "#d93025";
          });
      }

      function sendArduino(val) {
        if (writer) {
          try {
            writer.write(new TextEncoder().encode(val));
          } catch (e) {}
        }
      }

      function processEyes(eyePts, faceWidth) {
        var leftScore = measureEyelidGap(eyePts[0].x, eyePts[0].y, faceWidth);
        var rightScore = measureEyelidGap(eyePts[1].x, eyePts[1].y, faceWidth);

        if (leftScore < 0 || rightScore < 0) {
          closedFrames = 0;
          document.getElementById("debug").innerText =
            "Dark Object / Shadow Ignored";
          requestAnimationFrame(detectLoop);
          return;
        }

        var score = (leftScore + rightScore) / 2;

        if (score > 0) {
          if (learnCount < 10) {
            openBaseline =
              (openBaseline * learnCount + score) / (learnCount + 1);
            learnCount++;
            statusBox.innerText = "Locking onto Eyes...";
            statusBox.style.background = "#e8f0fe";
            statusBox.style.color = "#1a73e8";
          } else {
            if (score > openBaseline * 0.88) {
              openBaseline = openBaseline * 0.96 + score * 0.04;
            }

            var openness = score / Math.max(0.1, openBaseline);
            document.getElementById("debug").innerText =
              "Eyes Locked | Openness: " + Math.round(openness * 100) + "%";

            if (openness < 0.65) {
              closedFrames++;
              if (closedFrames > 22) {
                statusBox.innerText = "WAKE UP!";
                statusBox.style.background = "#d93025";
                statusBox.style.color = "white";
                document.getElementById("pageBody").style.backgroundColor =
                  "#fce8e6";

                try {
                  var osc = audio.createOscillator();
                  osc.type = "square";
                  osc.frequency.setValueAtTime(950, audio.currentTime);
                  osc.connect(audio.destination);
                  osc.start();
                  osc.stop(audio.currentTime + 0.12);
                } catch (e) {}

                sendArduino("1");
              }
            } else {
              closedFrames = 0;
              statusBox.innerText = "Awake";
              statusBox.style.background = "#e6f4ea";
              statusBox.style.color = "#137333";
              document.getElementById("pageBody").style.backgroundColor =
                "#f8f9fa";
              sendArduino("0");
            }
          }
        }
        requestAnimationFrame(detectLoop);
      }

      function detectLoop() {
        if (video.readyState < 2) {
          requestAnimationFrame(detectLoop);
          return;
        }

        pctx.drawImage(video, 0, 0, 320, 240);

        if (faceDetector) {
          faceDetector
            .detect(proc)
            .then(function (faces) {
              if (faces && faces.length > 0) {
                missingFrames = 0;
                var face = faces[0];
                var box = face.boundingBox;

                var cx = box.left + box.width / 2;
                var cy = box.top + box.height / 2;
                if (
                  lastFaceX !== -1 &&
                  Math.hypot(cx - lastFaceX, cy - lastFaceY) > 55
                ) {
                  resetForNewPerson();
                }
                lastFaceX = cx;
                lastFaceY = cy;

                var eyePts = [
                  {
                    x: box.left + box.width * 0.34,
                    y: box.top + box.height * 0.37,
                  },
                  {
                    x: box.left + box.width * 0.66,
                    y: box.top + box.height * 0.37,
                  },
                ];
                processEyes(eyePts, box.width);
              } else {
                missingFrames++;
                closedFrames = 0;
                if (missingFrames > 10) {
                  resetForNewPerson();
                  lastFaceX = -1;
                  lastFaceY = -1;
                }
                statusBox.innerText = "Waiting for Driver...";
                statusBox.style.background = "#fef7e0";
                statusBox.style.color = "#b06000";
                document.getElementById("debug").innerText =
                  "Scanning for Face...";
                document.getElementById("pageBody").style.backgroundColor =
                  "#f8f9fa";
                sendArduino("0");
                requestAnimationFrame(detectLoop);
              }
            })
            .catch(function () {
              faceDetector = null;
              requestAnimationFrame(detectLoop);
            });
        } else {
          processEyes(
            [
              { x: 120, y: 95 },
              { x: 200, y: 95 },
            ],
            140,
          );
        }
      }
    </script>
  </body>
</html>
