<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleeping Driver Detector</title>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  </head>
  <body
    id="pageBody"
    style="
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background-color: #f8f9fa;
      transition: 0.2s;
    "
  >
    <h2 style="margin: 8px 0 14px 0; color: #202124">
      Sleeping Driver Detector
    </h2>

    <button
      id="startBtn"
      onclick="startCamera()"
      style="
        width: 95%;
        max-width: 340px;
        padding: 16px;
        font-size: 18px;
        font-weight: bold;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
      "
    >
      1. Start Front Camera
    </button>

    <button
      onclick="connectArduino()"
      style="
        width: 95%;
        max-width: 340px;
        padding: 12px;
        font-size: 15px;
        background: #e8eaed;
        color: #333;
        border: none;
        border-radius: 10px;
        margin-bottom: 14px;
        cursor: pointer;
      "
    >
      2. Connect Arduino (Optional)
    </button>

    <div
      id="status"
      style="
        width: 95%;
        max-width: 340px;
        margin: 0 auto 14px auto;
        padding: 12px;
        border-radius: 10px;
        background: #e6f4ea;
        color: #137333;
        font-size: 20px;
        font-weight: bold;
      "
    >
      Ready! Tap Start
    </div>

    <video
      id="webcam"
      autoplay
      playsinline
      muted
      style="
        width: 260px;
        height: 260px;
        object-fit: cover;
        border-radius: 16px;
        transform: scaleX(-1);
        background: #000;
      "
    ></video>
    <div
      id="debug"
      style="margin-top: 10px; font-size: 16px; font-weight: bold; color: #555"
    >
      Eye Openness: --
    </div>

    <script>
      let writer,
        closedFrames = 0,
        faceMesh;
      let audio = new (window.AudioContext || window.webkitAudioContext)();
      const video = document.getElementById("webcam");
      const statusBox = document.getElementById("status");

      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      async function connectArduino() {
        try {
          const port = await navigator.serial.requestPort();
          await port.open({ baudRate: 9600 });
          writer = port.writable.getWriter();
          alert("Arduino Nano Connected!");
        } catch (e) {
          alert("No Arduino connected. Using mobile speaker alarm.");
        }
      }

      async function startCamera() {
        try {
          if (audio.state === "suspended") await audio.resume();
          statusBox.innerText = "Opening Camera...";

          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: 320, height: 240 },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();
          statusBox.innerText = "Loading Eye Sensor...";

          faceMesh = new FaceMesh({
            locateFile: (file) => `https://jsdelivr.net{file}`,
          });

          faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5,
          });

          faceMesh.onResults((results) => {
            const faces = results.multiFaceLandmarks;
            if (faces && faces.length > 0) {
              const lm = faces.at(0);
              const leftEAR =
                dist(lm.at(159), lm.at(145)) / dist(lm.at(33), lm.at(133));
              const rightEAR =
                dist(lm.at(386), lm.at(374)) / dist(lm.at(362), lm.at(263));
              const ear = (leftEAR + rightEAR) / 2;

              document.getElementById("debug").innerText =
                "Eye Openness: " + ear.toFixed(2);

              if (ear < 0.21) {
                closedFrames++;
                if (closedFrames > 20) {
                  statusBox.innerText = "WAKE UP!";
                  statusBox.style.background = "#d93025";
                  statusBox.style.color = "white";
                  document.getElementById("pageBody").style.backgroundColor =
                    "#fce8e6";

                  let osc = audio.createOscillator();
                  osc.type = "square";
                  osc.frequency.setValueAtTime(950, audio.currentTime);
                  osc.connect(audio.destination);
                  osc.start();
                  osc.stop(audio.currentTime + 0.12);

                  if (writer) writer.write(new TextEncoder().encode("1"));
                }
              } else {
                closedFrames = 0;
                statusBox.innerText = "Awake";
                statusBox.style.background = "#e6f4ea";
                statusBox.style.color = "#137333";
                document.getElementById("pageBody").style.backgroundColor =
                  "#f8f9fa";
                if (writer) writer.write(new TextEncoder().encode("0"));
              }
            }
          });

          statusBox.innerText = "Awake";
          processVideo();
        } catch (err) {
          statusBox.innerText = "Error: " + err.message;
          statusBox.style.background = "#fce8e6";
          statusBox.style.color = "#d93025";
        }
      }

      async function processVideo() {
        if (video.readyState >= 2 && faceMesh) {
          await faceMesh.send({ image: video });
        }
        requestAnimationFrame(processVideo);
      }
    </script>
  </body>
</html>
