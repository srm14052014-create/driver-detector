<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Driver Detector</title>
  </head>
  <body
    id="body"
    style="
      font-family: sans-serif;
      text-align: center;
      padding: 12px;
      margin: 0;
      background: #f8f9fa;
    "
  >
    <h3 style="margin: 6px 0 10px">Sleeping Driver Detector</h3>
    <button
      onclick="start()"
      style="
        width: 92%;
        max-width: 320px;
        padding: 14px;
        font-size: 17px;
        font-weight: bold;
        background: #1a73e8;
        color: #fff;
        border: 0;
        border-radius: 10px;
        margin-bottom: 8px;
      "
    >
      1. Start Camera
    </button>
    <button
      onclick="connectUSB()"
      style="
        width: 92%;
        max-width: 320px;
        padding: 10px;
        font-size: 14px;
        background: #e8eaed;
        color: #333;
        border: 0;
        border-radius: 8px;
        margin-bottom: 10px;
      "
    >
      2. Connect Arduino
    </button>
    <div
      id="status"
      style="
        width: 92%;
        max-width: 320px;
        margin: 0 auto 10px;
        padding: 10px;
        border-radius: 8px;
        background: #e6f4ea;
        color: #137333;
        font-size: 19px;
        font-weight: bold;
      "
    >
      Ready! Instant Start
    </div>
    <video
      id="vid"
      autoplay
      playsinline
      muted
      style="
        width: 240px;
        height: 240px;
        object-fit: cover;
        border-radius: 14px;
        transform: scaleX(-1);
        background: #000;
      "
    ></video>
    <div
      id="info"
      style="margin-top: 8px; font-size: 14px; font-weight: bold; color: #444"
    >
      Waiting...
    </div>
    <canvas id="c" width="320" height="240" style="display: none"></canvas>

    <script>
      var writer = null,
        closedStart = 0,
        closedStreak = 0,
        openRef = 0,
        calFrames = 0,
        miss = 0,
        lx = -1,
        ly = -1,
        fd = null,
        audio = null,
        sirenTick = 0;
      var vid = document.getElementById("vid"),
        c = document.getElementById("c"),
        ctx = c.getContext("2d", { willReadFrequently: true }),
        st = document.getElementById("status"),
        info = document.getElementById("info");

      try {
        if (window.FaceDetector)
          fd = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
      } catch (e) {}

      function connectUSB() {
        if (!navigator.serial) return alert("Using mobile speaker alarm.");
        navigator.serial
          .requestPort()
          .then(function (p) {
            return p.open({ baudRate: 9600 }).then(function () {
              writer = p.writable.getWriter();
              alert("Arduino Connected!");
            });
          })
          .catch(function () {
            alert("Using mobile speaker alarm.");
          });
      }

      function sendUSB(v) {
        if (writer)
          try {
            writer.write(new TextEncoder().encode(v));
          } catch (e) {}
      }

      function playLoudSiren() {
        if (!audio) return;
        try {
          var osc = audio.createOscillator(),
            gain = audio.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(
            sirenTick % 2 === 0 ? 1100 : 800,
            audio.currentTime,
          );
          sirenTick++;
          gain.gain.setValueAtTime(1.0, audio.currentTime);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start();
          osc.stop(audio.currentTime + 0.14);
        } catch (e) {}
      }

      function measureEye(cx, cy, fw, fh) {
        var rx = Math.max(8, Math.round(fw * 0.085));
        var ry = Math.max(6, Math.round(fh * 0.055));
        var x0 = Math.max(1, Math.round(cx - rx));
        var y0 = Math.max(1, Math.round(cy - ry));
        var w = Math.min(318 - x0, rx * 2);
        var h = Math.min(238 - y0, ry * 2);
        if (w <= 4 || h <= 4) return -1;

        var d = ctx.getImageData(x0, y0, w, h).data;
        var borderSum = 0,
          borderCount = 0,
          centerMin = 255,
          totalLum = 0;

        for (var y = 0; y < h; y++) {
          for (var x = 0; x < w; x++) {
            var i = (y * w + x) * 4;
            var lum =
              d.at(i) * 0.299 + d.at(i + 1) * 0.587 + d.at(i + 2) * 0.114;
            totalLum += lum;

            if (y < 2 || y >= h - 2 || x < 2 || x >= w - 2) {
              borderSum += lum;
              borderCount++;
            } else if (
              x > w * 0.28 &&
              x < w * 0.72 &&
              y > h * 0.25 &&
              y < h * 0.75
            ) {
              if (lum < centerMin) centerMin = lum;
            }
          }
        }

        var avgLum = totalLum / (w * h);
        if (avgLum < 15 || borderCount === 0) return -1;

        var skinAvg = borderSum / borderCount;
        return (skinAvg - centerMin) / Math.max(15, skinAvg);
      }

      function start() {
        st.innerText = "Opening Camera...";
        try {
          if (!audio)
            audio = new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === "suspended") audio.resume();
        } catch (e) {}
        navigator.mediaDevices
          .getUserMedia({
            video: { facingMode: "user", width: 320, height: 240 },
            audio: false,
          })
          .then(function (s) {
            vid.srcObject = s;
            return vid.play();
          })
          .then(function () {
            calFrames = 0;
            openRef = 0;
            closedStart = 0;
            closedStreak = 0;
            loop();
          })
          .catch(function (e) {
            st.innerText = "Error: " + e.message;
          });
      }

      function process(pts, fw, fh) {
        var e1 = measureEye(pts.at(0).x, pts.at(0).y, fw, fh);
        var e2 = measureEye(pts.at(1).x, pts.at(1).y, fw, fh);

        if (e1 < 0 || e2 < 0) {
          closedStart = 0;
          closedStreak = 0;
          info.innerText = "Camera Covered / Too Dark";
          return requestAnimationFrame(loop);
        }

        var val = (e1 + e2) / 2;
        var dist = fw > 175 ? "Near" : fw < 85 ? "Far" : "Optimal";

        if (calFrames < 15) {
          openRef = (openRef * calFrames + val) / (calFrames + 1);
          calFrames++;
          st.innerText = "Locking Eyes...";
          st.style.background = "#e8f0fe";
          st.style.color = "#1a73e8";
        } else {
          // Keep openRef stable so raised eyebrows or shadows never cause false triggers
          if (
            val > openRef * 0.85 &&
            val < openRef * 1.25 &&
            closedStreak === 0
          ) {
            openRef = openRef * 0.98 + val * 0.02;
          }

          var openPct = Math.round((val / Math.max(0.05, openRef)) * 100);

          // Only count as closed when openness drops below 45% for at least 4 frames in a row
          if (openPct < 45) {
            closedStreak++;
            if (closedStreak >= 4) {
              if (closedStart === 0) closedStart = Date.now();
              var elapsed = (Date.now() - closedStart) / 1000;
              info.innerText =
                dist + " | Closed: " + elapsed.toFixed(1) + "s / 3.0s";
              if (elapsed >= 3.0) {
                st.innerText = "WAKE UP!";
                st.style.background = "#d93025";
                st.style.color = "#fff";
                document.getElementById("body").style.background = "#fce8e6";
                playLoudSiren();
                sendUSB("1");
              }
            }
          } else {
            closedStreak = 0;
            closedStart = 0;
            info.innerText =
              dist + " | Openness: " + Math.min(100, openPct) + "%";
            st.innerText = "Awake";
            st.style.background = "#e6f4ea";
            st.style.color = "#137333";
            document.getElementById("body").style.background = "#f8f9fa";
            sendUSB("0");
          }
        }
        requestAnimationFrame(loop);
      }

      function loop() {
        if (vid.readyState < 2) return requestAnimationFrame(loop);
        ctx.drawImage(vid, 0, 0, 320, 240);
        if (fd) {
          fd.detect(c)
            .then(function (faces) {
              if (faces && faces.length > 0) {
                miss = 0;
                var f = faces.at(0),
                  b = f.boundingBox,
                  cx = b.left + b.width / 2,
                  cy = b.top + b.height / 2;
                if (lx !== -1 && Math.hypot(cx - lx, cy - ly) > 85) {
                  calFrames = 0;
                  openRef = 0;
                  closedStart = 0;
                  closedStreak = 0;
                }
                lx = cx;
                ly = cy;
                var eyes = (f.landmarks || []).filter(function (l) {
                  return l.type === "eye";
                });
                var pts =
                  eyes.length >= 2
                    ? [eyes.at(0).locations.at(0), eyes.at(1).locations.at(0)]
                    : [
                        {
                          x: b.left + b.width * 0.34,
                          y: b.top + b.height * 0.37,
                        },
                        {
                          x: b.left + b.width * 0.66,
                          y: b.top + b.height * 0.37,
                        },
                      ];
                process(pts, b.width, b.height);
              } else {
                if (++miss > 10) {
                  calFrames = 0;
                  openRef = 0;
                  closedStart = 0;
                  closedStreak = 0;
                  lx = -1;
                  ly = -1;
                }
                st.innerText = "Waiting for Driver...";
                st.style.background = "#fef7e0";
                st.style.color = "#b06000";
                info.innerText = "Scanning for Face...";
                document.getElementById("body").style.background = "#f8f9fa";
                sendUSB("0");
                requestAnimationFrame(loop);
              }
            })
            .catch(function () {
              fd = null;
              requestAnimationFrame(loop);
            });
        } else {
          process(
            [
              { x: 120, y: 95 },
              { x: 200, y: 95 },
            ],
            140,
            140,
          );
        }
      }
    </script>
  </body>
</html>
