<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleeping Driver Detector</title>
  </head>
  <body
    id="pageBody"
    style="
      font-family: sans-serif;
      text-align: center;
      padding: 16px;
      margin: 0;
      background-color: #f8f9fa;
      transition: 0.2s;
    "
  >
    <h2 style="margin: 8px 0 14px 0; color: #202124">
      Sleeping Driver Detector
    </h2>

    <button
      id="startBtn"
      onclick="startCamera()"
      style="
        width: 95%;
        max-width: 340px;
        padding: 16px;
        font-size: 18px;
        font-weight: bold;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
      "
    >
      1. Start Auto Detection
    </button>

    <button
      onclick="connectArduino()"
      style="
        width: 95%;
        max-width: 340px;
        padding: 11px;
        font-size: 14px;
        background: #e8eaed;
        color: #333;
        border: none;
        border-radius: 10px;
        margin-bottom: 12px;
        cursor: pointer;
      "
    >
      2. Connect Arduino (Optional)
    </button>

    <div
      id="status"
      style="
        width: 95%;
        max-width: 340px;
        margin: 0 auto 12px auto;
        padding: 12px;
        border-radius: 10px;
        background: #e6f4ea;
        color: #137333;
        font-size: 20px;
        font-weight: bold;
      "
    >
      Ready! Tap Start
    </div>

    <div
      style="position: relative; width: 260px; height: 260px; margin: 0 auto"
    >
      <video
        id="webcam"
        autoplay
        playsinline
        muted
        style="
          width: 260px;
          height: 260px;
          object-fit: cover;
          border-radius: 16px;
          transform: scaleX(-1);
          background: #000;
        "
      ></video>
      <canvas
        id="overlay"
        width="260"
        height="260"
        style="
          position: absolute;
          top: 0;
          left: 0;
          pointer-events: none;
          transform: scaleX(-1);
        "
      ></canvas>
    </div>

    <div
      id="debug"
      style="margin-top: 10px; font-size: 15px; font-weight: bold; color: #444"
    >
      Eye Openness: Waiting...
    </div>
    <canvas id="proc" width="320" height="240" style="display: none"></canvas>

    <script>
      let writer,
        closedFrames = 0,
        openBaseline = 0,
        learnCount = 0;
      let faceDetector = null;
      let audio = null;

      const video = document.getElementById("webcam");
      const proc = document.getElementById("proc");
      const pctx = proc.getContext("2d", { willReadFrequently: true });
      const overlay = document.getElementById("overlay");
      const octx = overlay.getContext("2d");
      const statusBox = document.getElementById("status");

      // Safely initialize FaceDetector without crashing the script
      try {
        if ("FaceDetector" in window) {
          faceDetector = new FaceDetector({
            fastMode: true,
            maxDetectedFaces: 1,
          });
        }
      } catch (err) {
        faceDetector = null;
      }

      async function connectArduino() {
        try {
          const port = await navigator.serial.requestPort();
          await port.open({ baudRate: 9600 });
          writer = port.writable.getWriter();
          alert("Arduino Nano Connected!");
        } catch (e) {
          alert("No Arduino connected. Using mobile speaker alarm.");
        }
      }

      function measureEyelidGap(cx, cy, faceWidth) {
        const rx = Math.max(5, Math.round(faceWidth * 0.06));
        const ry = Math.max(4, Math.round(faceWidth * 0.05));
        const x0 = Math.max(1, Math.round(cx - rx));
        const y0 = Math.max(1, Math.round(cy - ry));
        const w = Math.min(318 - x0, rx * 2);
        const h = Math.min(238 - y0, ry * 2);
        if (w <= 2 || h <= 2) return 0;

        const data = pctx.getImageData(x0, y0, w, h).data;
        let verticalEdge = 0;
        let validPixels = 0;

        for (let y = 0; y < h - 1; y++) {
          for (let x = 0; x < w; x++) {
            const iTop = (y * w + x) * 4;
            const iBot = ((y + 1) * w + x) * 4;
            const lumTop =
              data.at(iTop) * 0.299 +
              data.at(iTop + 1) * 0.587 +
              data.at(iTop + 2) * 0.114;
            const lumBot =
              data.at(iBot) * 0.299 +
              data.at(iBot + 1) * 0.587 +
              data.at(iBot + 2) * 0.114;

            // Ignore solid black objects/hair (lum < 22)
            if (lumTop > 22 && lumBot > 22) {
              verticalEdge += Math.abs(lumTop - lumBot);
              validPixels++;
            }
          }
        }
        return validPixels > 0 ? verticalEdge / validPixels : 0;
      }

      async function startCamera() {
        try {
          statusBox.innerText = "Opening Camera...";
          if (!audio) {
            audio = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audio.state === "suspended") {
            await audio.resume();
          }

          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: 320, height: 240 },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();
          learnCount = 0;
          openBaseline = 0;
          detectLoop();
        } catch (err) {
          statusBox.innerText = "Error: " + err.message;
          statusBox.style.background = "#fce8e6";
          statusBox.style.color = "#d93025";
        }
      }

      async function detectLoop() {
        if (video.readyState >= 2) {
          pctx.drawImage(video, 0, 0, 320, 240);
          octx.clearRect(0, 0, 260, 260);
          const scaleX = 260 / 320,
            scaleY = 260 / 240;

          let eyePts = [];
          let faceWidth = 140;
          let faceDetected = false;

          if (faceDetector) {
            try {
              const faces = await faceDetector.detect(proc);
              if (faces.length > 0) {
                faceDetected = true;
                const face = faces.at(0);
                const box = face.boundingBox;
                faceWidth = box.width;

                const eyes = (face.landmarks || []).filter(
                  (l) => l.type === "eye",
                );
                if (eyes.length >= 2) {
                  eyePts = [
                    eyes.at(0).locations.at(0),
                    eyes.at(1).locations.at(0),
                  ];
                } else {
                  eyePts = [
                    {
                      x: box.left + box.width * 0.34,
                      y: box.top + box.height * 0.37,
                    },
                    {
                      x: box.left + box.width * 0.66,
                      y: box.top + box.height * 0.37,
                    },
                  ];
                }
              }
            } catch (e) {
              faceDetector = null;
            }
          }

          // Fallback center eye points if FaceDetector is unavailable
          if (!faceDetector) {
            faceDetected = true;
            eyePts = [
              { x: 120, y: 95 },
              { x: 200, y: 95 },
            ];
          }

          if (faceDetected && eyePts.length === 2) {
            // Draw tight green circles on eye centers
            octx.strokeStyle = "#00e676";
            octx.lineWidth = 2.5;
            eyePts.forEach((pt) => {
              octx.beginPath();
              octx.arc(pt.x * scaleX, pt.y * scaleY, 10, 0, Math.PI * 2);
              octx.stroke();
            });

            const score =
              (measureEyelidGap(eyePts.at(0).x, eyePts.at(0).y, faceWidth) +
                measureEyelidGap(eyePts.at(1).x, eyePts.at(1).y, faceWidth)) /
              2;

            if (score > 0) {
              if (learnCount < 20) {
                openBaseline =
                  (openBaseline * learnCount + score) / (learnCount + 1);
                learnCount++;
                statusBox.innerText =
                  "Learning Eyes (" +
                  Math.round((learnCount / 20) * 100) +
                  "%)";
              } else {
                if (score > openBaseline * 0.88) {
                  openBaseline = openBaseline * 0.96 + score * 0.04;
                }

                const openness = score / Math.max(0.1, openBaseline);
                document.getElementById("debug").innerText =
                  "Eye Openness: " + Math.round(openness * 100) + "%";

                if (openness < 0.65) {
                  closedFrames++;
                  if (closedFrames > 22) {
                    statusBox.innerText = "WAKE UP!";
                    statusBox.style.background = "#d93025";
                    statusBox.style.color = "white";
                    document.getElementById("pageBody").style.backgroundColor =
                      "#fce8e6";

                    let osc = audio.createOscillator();
                    osc.type = "square";
                    osc.frequency.setValueAtTime(950, audio.currentTime);
                    osc.connect(audio.destination);
                    osc.start();
                    osc.stop(audio.currentTime + 0.12);

                    if (writer) writer.write(new TextEncoder().encode("1"));
                  }
                } else {
                  closedFrames = 0;
                  statusBox.innerText = "Awake";
                  statusBox.style.background = "#e6f4ea";
                  statusBox.style.color = "#137333";
                  document.getElementById("pageBody").style.backgroundColor =
                    "#f8f9fa";
                  if (writer) writer.write(new TextEncoder().encode("0"));
                }
              }
            }
          } else {
            closedFrames = 0;
            statusBox.innerText = "Show Face to Camera";
            statusBox.style.background = "#fef7e0";
            statusBox.style.color = "#b06000";
          }
        }
        requestAnimationFrame(detectLoop);
      }
    </script>
  </body>
</html>
